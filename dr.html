<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0f1622">
<title>LibreTV · DR 影视</title>
<link rel="icon" href="image/logo.png"><link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="css/dr-native.css?v=20261016b">
</head>
<body>
<main class="dr-shell">
<nav class="dr-tabs" aria-label="影视系统切换">
<a href="./">LibreTV 主站</a><a href="dr.html" aria-current="page">LibreTV · DR专区</a>
</nav>
<header class="dr-header">
<span class="dr-eyebrow">LIBRETV · 第二页</span>
<h1>DR 影视</h1>
<p>由 LibreTV 显示和操作，影视数据仅来自独立 drpyS 服务。原主站的榜单、直播和普通影视源不会在这一页混入。</p>
</header>
<section class="dr-toolbar" aria-labelledby="source-title">
<div class="dr-source-row">
<div class="dr-source-select"><label for="dr-source" id="source-title">DR 影视源</label>
<select id="dr-source" disabled><option value="">等待 DR 服务连接</option></select></div>
<button id="dr-reload" type="button" class="dr-button">重新获取 DR 源</button>
</div>
<form id="dr-search-form" class="dr-search" role="search">
<label for="dr-search-input">在当前 DR 源中找片</label>
<div class="dr-search-row"><input id="dr-search-input" placeholder="输入电影、电视剧名称" maxlength="85" autocomplete="off" required>
<button type="submit" class="dr-button dr-primary">搜索</button></div>
</form>
<p class="dr-status" role="status" aria-live="polite" id="dr-status">正在检查 DR 后端配置……</p>
</section>
<section class="dr-content" aria-label="DR 影视内容">
<div class="dr-heading"><div><span class="dr-eyebrow" id="dr-mode-label">当前 DR 源</span><h2 id="dr-heading">DR 首页推荐</h2></div>
<button type="button" id="dr-home" class="dr-button" disabled>返回 DR 推荐</button></div>
<div class="dr-categories" id="dr-categories" aria-label="DR 分类"></div>
<div class="dr-grid" id="dr-grid" aria-live="polite"></div>
<div class="dr-bottom"><button type="button" id="dr-more" class="dr-button" hidden>加载下一页</button></div>
</section>
<dialog id="dr-detail" class="dr-detail" aria-labelledby="dr-detail-title">
<header class="dr-detail-head"><div><span class="dr-eyebrow">DR 影片详情与选集</span><h2 id="dr-detail-title">正在加载</h2></div>
<button type="button" id="dr-detail-close" class="dr-button">关闭</button></header>
<div id="dr-detail-content"></div>
<p id="dr-play-status" class="dr-status" role="status" aria-live="polite">点击要看的集数开始解析。</p>
</dialog>
<footer>DR 页面由 LibreTV 原生呈现，DR 数据、搜索与推荐均不进入主站。<a href="./">返回原 LibreTV</a></footer>
</main>
<script src="js/dr-native.js?v=20261016b" defer></script>
<script src="js/pwa-register.js" defer></script>
</body></html>
